<!doctype html><html lang="en" data-theme="light" style="color-scheme: light;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euroform Formwork Products | ProGM21 PH Corporation</title>
<meta name="description" content="Smarter formwork solutions for modern construction. Explore Euroform products, installation guides and request a quotation.">
<meta property="og:title" content="Euroform Formwork Products">
<meta property="og:description" content="Practical formwork solutions for efficient, organized and professional construction projects.">
<meta property="og:type" content="website">
<style>
:root{--bg:#fff;--bg2:#f1f3f6;--tx:#1b2430;--mu:#5b6675;--navy:#12284c;--or:#f26b1d;--bd:#d9dee6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1622;--bg2:#17212f;--tx:#e8edf4;--mu:#9aa6b6;--navy:#0a1730;--bd:#2a3648}}
:root[data-theme="dark"]{--bg:#0f1622;--bg2:#17212f;--tx:#e8edf4;--mu:#9aa6b6;--navy:#0a1730;--bd:#2a3648}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--navy);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:10px 18px;max-width:1100px;margin:auto}
nav b{color:#fff;margin-right:auto;font-size:18px}nav b span{color:var(--or)}
nav a,nav button{color:#e6ebf3;text-decoration:none;font-size:14px;background:none;border:0;cursor:pointer;padding:6px 2px}
nav a.on{color:var(--or);border-bottom:2px solid var(--or)}
main{animation:f .4s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.w{max-width:1100px;margin:auto;padding:36px 18px}
.hero{background:linear-gradient(135deg,rgba(18,40,76,.96),rgba(18,40,76,.8)),repeating-linear-gradient(45deg,#1d3a6b 0 14px,#12284c 14px 28px);color:#fff}
.hero .w{padding:72px 18px}.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.15;margin:0 0 14px;max-width:760px}.hero p{max-width:620px;color:#d5deeb;font-size:18px}
.btn{display:inline-block;background:var(--or);color:#fff;border:0;border-radius:8px;padding:12px 20px;font-weight:600;text-decoration:none;cursor:pointer;font-size:15px;margin:6px 8px 6px 0;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.o{background:none;border:2px solid #fff}.btn.g{background:var(--navy);color:#fff}
h2{color:var(--navy);margin:0 0 16px;font-size:28px}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:#fff}}:root[data-theme="dark"] h2{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:18px}.card h3{margin:0 0 6px;color:var(--or);font-size:18px}
.alt{background:var(--bg2)}.alt .card{background:var(--bg)}
img,video{max-width:100%;border-radius:10px;display:block}
.pr{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-bottom:44px;padding-bottom:36px;border-bottom:1px solid var(--bd)}
@media(min-width:760px){.pr{grid-template-columns:1fr 1.2fr}}
table{border-collapse:collapse;width:100%}td{border-bottom:1px solid var(--bd);padding:7px 4px;vertical-align:top}td:first-child{color:var(--mu);width:40%}
.tbl{overflow-x:auto}.note{font-size:13px;color:var(--mu)}.tag{background:#ffe9d9;color:#9a3d05;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.gal figure{margin:0;cursor:pointer}.gal img,.gal video{width:100%;aspect-ratio:4/3;object-fit:cover}.gal figcaption{font-size:13px;color:var(--mu);padding-top:4px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}label{font-size:13px;color:var(--mu)}
footer{background:var(--navy);color:#b9c4d6;text-align:center;padding:22px;font-size:13px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}#lb img,#lb video{max-height:92vh;max-width:96vw;border-radius:0}
#adm{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;overflow:auto;padding:16px}
#adm .box{background:var(--bg);max-width:860px;margin:auto;border-radius:12px;padding:20px}
.row{border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0}.sm{padding:6px 12px;font-size:13px}
ol,ul{padding-left:20px}
.pl{--pc:#12284c}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pl{--pc:#ffc9a3}}:root[data-theme="dark"] .pl{--pc:#ffc9a3}
.pl h3{margin:28px 0 10px;font-size:20px;color:var(--pc)}
.pbn{display:flex;gap:14px;align-items:center;background:var(--bg2);border:1px solid var(--bd);border-left:5px solid var(--or);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.pbs{flex:none;width:44px;height:44px;border-radius:50%;background:var(--or);color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pjump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}.pjump button{background:var(--bg2);border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.pl .tbl{border:1px solid var(--bd);border-radius:12px;overflow:auto}
.pl table{border-collapse:separate;border-spacing:0;min-width:480px}
.pl th{background:var(--navy);color:#fff;text-align:left;font-size:13px;font-weight:600;padding:11px 12px;white-space:nowrap}
.pl th.p{text-align:right}.pl th.ref{background:var(--or)}
.pl td{padding:11px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
.pl tbody tr:nth-child(even) td{background:var(--bg2)}.pl tbody tr:last-child td{border-bottom:0}
.pl td:first-child{color:var(--tx);font-weight:600;width:auto;min-width:150px}
.pl td:first-child,.pl th:first-child{position:sticky;left:0;z-index:2}.pl td:first-child{background:var(--bg)}.pl tbody tr:nth-child(even) td:first-child{background:var(--bg2)}
.pl td.p{text-align:right;white-space:nowrap;font-weight:700;font-size:17px;color:var(--pc);font-variant-numeric:tabular-nums}
.pl .pz{color:var(--or);font-weight:800;margin-right:2px}.pl .na{color:var(--mu);font-weight:400;font-size:14px}
.pl .chip{display:inline-block;background:#ffe9d9;color:#9a3d05;border-radius:99px;padding:2px 10px;margin:2px 4px 2px 0;font-size:13px;white-space:nowrap}.pl .chip b{font-size:14px}
.pl .rn{background:var(--bg2);border:1px dashed var(--bd);border-radius:12px;padding:14px 16px;margin:14px 0}
</style></head><body>
<header><nav id="nav"></nav></header>
<main id="root"></main>
<footer id="ft">© 2026 ProGM21 PH Corporation - Euroform Formwork Products</footer>
<div id="lb" onclick="this.style.display='none';this.innerHTML=''"></div>
<script src="site-data.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=SITE,admin=false,DB=null;
const U=p=>p||'';
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#dfe5ee"/><path d="M60 230h280M90 230V90h60v140M170 230V60h60v170M250 230V110h60v120" stroke="#12284c" stroke-width="8" fill="none"/><text x="200" y="272" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#5b6675">Photo coming soon</text></svg>');
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const C=()=>D.contact;
function enc(){const c=C();return 'Hello, I would like to request a quotation for Euroform products.'}
function links(){const c=C();let h='';if(c.whatsapp)h+=`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/${esc(c.whatsapp.replace(/\D/g,''))}?text=${encodeURIComponent(enc())}">WhatsApp</a>`;if(c.messenger)h+=`<a class="btn g" target="_blank" rel="noopener" href="${esc(c.messenger)}">Messenger</a>`;if(c.email)h+=`<a class="btn g" href="mailto:${esc(c.email)}?subject=Quotation%20Request">Email us</a>`;return h}
const catBtn=(c='g')=>D.brochure?`<a class="btn ${c}" href="${esc(D.brochure)}" target="_blank" rel="noopener">Download catalogue (PDF)</a>`:'';
function clientsBlock(){const cl=lines(D.clients);if(!cl.length)return admin?'<div class="w"><h2>Our Clients</h2><div class="card note">Only you can see this note: add your clients in Admin &gt; Our clients so they appear here for visitors.</div></div>':'';return `<div class="alt"><div class="w"><h2>Our Clients</h2><p class="note">Contractors and companies who use Euroform and ProGM21 products.</p><div class="grid">${cl.map(l=>{const a=l.split('|');return `<div class="card"><h3>${esc(a[0].trim())}</h3>${a[1]?esc(a.slice(1).join('|').trim()):''}</div>`}).join('')}</div></div></div>`}
const pages={
home(){const p=D.products[0];return `<section class="hero"><div class="w"><h1>Smarter Formwork Solutions for Modern Construction.</h1><p>Discover practical formwork solutions designed to support efficient, organized, and professional construction projects.</p><a class="btn" href="#products">Explore Our Products</a><a class="btn o" href="#contact">Request a Quotation</a>${catBtn('o')}</div></section>
<div class="w"><h2>Why Euroform</h2><div class="grid">${[['Efficient','Installation and removal that keeps work moving.'],['Organized','Clear workflows on site.'],['Reusable','Reuse where applicable to the product and project.'],['Neat results','More consistent concrete work when properly installed.']].map(a=>`<div class="card"><h3>${a[0]}</h3>${a[1]}</div>`).join('')}</div><p class="note">Actual results depend on the product specification, project design, and proper installation. Potential savings in labor and time are not guaranteed.</p></div>
<div class="alt"><div class="w"><h2>Applications</h2><div class="grid">${[['Residential','Columns, beams, slabs and walls for houses and low-rise buildings.'],['Commercial','Structural concrete work for offices, retail and mixed-use projects.'],['Industrial','Compatible concrete structures for warehouses and plants.']].map(a=>`<div class="card"><h3>${a[0]}</h3>${a[1]}</div>`).join('')}</div></div></div>
${clientsBlock()}${p?`<div class="w"><h2>Featured product</h2><div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><a class="btn" href="#products">View details</a></div></div>`:''}`},
products(){return `<div class="w"><h2>Products</h2>${D.products.map(p=>`<article class="pr" id="${esc(p.id)}"><img src="${p.img?U(p.img):PH}" alt="${esc(p.name)}"><div><h3 style="font-size:24px;margin:0 0 8px">${esc(p.name)}</h3><p>${esc(p.desc)}</p>
<div class="tbl"><table>${lines(p.specs).map(l=>{const i=l.indexOf(':');return `<tr><td>${esc(l.slice(0,i))}</td><td>${esc(l.slice(i+1))}</td></tr>`}).join('')}</table></div>
<p><b>Available sizes:</b> ${esc(p.sizes)}<br><b>Accessories:</b> ${esc(p.accessories)}</p><b>Key features</b><ul>${lines(p.features).map(l=>`<li>${esc(l)}</li>`).join('')}</ul><b>Installation guide</b><ol>${lines(p.steps).map(l=>`<li>${esc(l)}</li>`).join('')}</ol><b>Safety, handling and maintenance</b><p>${esc(p.safety)}</p>
${catBtn()}<a class="btn" href="#contact" onclick="window.pick='${esc(p.name)}'">Request pricing</a></div></article>`).join('')||'<p>No products yet.</p>'}</div>`},
gallery(){return `<div class="w"><h2>Gallery and Videos</h2>${D.gallery.length?`<div class="gal">${D.gallery.map((g,i)=>`<figure onclick="lb(${i})">${g.t=='video'?`<video src="${U(g.src)}" muted preload="metadata"></video>`:`<img src="${U(g.src)}" alt="${esc(g.cap)}" loading="lazy">`}<figcaption>${esc(g.cap)}</figcaption></figure>`).join('')}</div>`:'<div class="card">No photos or videos yet.</div>'}</div>`},
pricing(){const peso=v=>{v=String(v==null?'':v).trim();if(!/\d/.test(v))return '<span class="na">'+(v&&v!=='-'?esc(v):'&mdash;')+'</span>';return v.split(/(\d[\d,]*(?:\.\d+)?)/).map((p,i)=>i%2?'<span class="pz">&#8369;</span>'+p:esc(p)).join('')},chips=v=>v.split(' / ').map(p=>{const m=p.trim().match(/^(L\d+)\s+([\d.,]+)$/);return m?'<span class="chip">'+esc(m[1])+' <b><span class="pz">&#8369;</span>'+m[2]+'</b></span>':esc(p)}).join(' '),T=(x,h,pc,cl)=>{pc=pc||[];cl=cl||{};return '<div class="tbl"><table><thead><tr>'+h.map((y,i)=>'<th class="'+(pc.includes(i)?'p ':'')+(cl[i]||'')+'">'+esc(y)+'</th>').join('')+'</tr></thead><tbody>'+lines(x).map(l=>{const c=l.split('|').map(y=>y.trim()),fl=/^Flat ties/i.test(c[0]);return '<tr>'+c.map((y,i)=>'<td class="'+(pc.includes(i)?'p':'')+'">'+(fl&&i==1?chips(y):pc.includes(i)?peso(y):esc(y))+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'},go=id=>`onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth'})"`;return `<div class="w pl"><h2>Pricelist</h2><div class="pbn"><span class="pbs">&#8369;</span><div><b>All prices are in Philippine Peso (&#8369;), VAT inclusive.</b><br><span class="note">Subject to change - request a quotation to confirm.</span></div></div><div class="pjump"><button type="button" ${go('pl1')}>Euro Form items</button><button type="button" ${go('pl2')}>Accessories</button><button type="button" ${go('pl3')}>Rental</button></div><h3 id="pl1">Euro Form items</h3>${T(D.sale4,['Item','Size (mm)','Brand new','Refurbished'],[2,3],{3:'ref'})}<h3 id="pl2">Accessories and consumables</h3>${T(D.sale3,['Item','Specification','Unit price'],[2])}<h3 id="pl3">Rental</h3>${T(D.rent,['Item','Base price','1 day','30 days','60 days','90 days','120 days','150 days','180 days'],[1,2,3,4,5,6,7,8])}<div class="rn"><b>How rental is computed</b><br>Total = (number of days used &times; price per day + base price) &times; quantity<br><span class="note">Missing or damaged items are charged at the selling price.</span></div>${catBtn()}<a class="btn" href="#contact">Request a Quotation</a></div>`},
about(){return `<div class="w"><h2>About Us</h2><div class="card"><h3>${esc(D.brand)}</h3><p style="white-space:pre-line">${esc(D.about)}</p></div></div>`},
contact(){const c=C(),pk=window.pick||'';return `<div class="w"><h2>Contact and Inquiry</h2><div class="grid"><div class="card"><h3>Contact details</h3>${[['Contact person',c.name],['Telephone',c.mobile],['Viber',c.viber],['Email',c.email],['Address',c.address]].map(a=>`<p><b>${a[0]}:</b> ${a[1]?esc(a[1]):'<span class="note">not set yet</span>'}</p>`).join('')}${c.facebook?`<p><a href="${esc(c.facebook)}" target="_blank" rel="noopener">Facebook page</a></p>`:''}<div>${links()}</div></div>
<div class="card"><h3>Request a Quotation</h3><div id="f"><label>Name</label><input id="q_n"><label>Company</label><input id="q_c"><label>Contact number</label><input id="q_t"><label>Project location</label><input id="q_l"><label>Product requirements</label><input id="q_r" value="${esc(pk)}"><label>Message</label><textarea id="q_m" rows="3"></textarea><button class="btn" onclick="send()">Request a Quotation</button><div id="q_o" class="note"></div></div></div></div></div>`}};
function render(){let h=location.hash.slice(1)||'home';if(!pages[h])h='home';$('#root').innerHTML=pages[h]();$('#nav').innerHTML=`<b>Euro<span>form</span></b>`+['home','products','pricing','gallery','about','contact'].map(k=>`<a href="#${k}" class="${k==h?'on':''}">${k[0].toUpperCase()+k.slice(1)}</a>`).join('');$('#ft').textContent='© '+new Date().getFullYear()+' '+D.brand+' - Euroform Formwork Products';scrollTo(0,0)}
addEventListener('hashchange',render);
function lb(i){const g=D.gallery[i],e=$('#lb');e.innerHTML=g.t=='video'?`<video src="${U(g.src)}" controls autoplay></video>`:`<img src="${U(g.src)}" alt="">`;e.style.display='flex';try{e.requestFullscreen&&e.requestFullscreen()}catch(x){}}
async function send(){const v=i=>$('#'+i).value.trim(),r={name:v('q_n'),company:v('q_c'),phone:v('q_t'),location:v('q_l'),req:v('q_r'),msg:v('q_m'),at:new Date().toISOString()};if(!r.name||!r.phone){$('#q_o').textContent='Please enter your name and contact number.';return}
let saved=false;try{if(DB){await DB.doc('inquiries/'+Date.now()+'_'+Math.random().toString(36).slice(2,6)).set(r);saved=true}}catch(e){}
const body=`Quotation request%0AName: ${encodeURIComponent(r.name)}%0ACompany: ${encodeURIComponent(r.company)}%0APhone: ${encodeURIComponent(r.phone)}%0ALocation: ${encodeURIComponent(r.location)}%0ARequirements: ${encodeURIComponent(r.req)}%0AMessage: ${encodeURIComponent(r.msg)}`,c=C();let h=saved?'Thank you! Your inquiry was recorded. ':'';
if(c.email)h+=`<a class="btn g sm" href="mailto:${esc(c.email)}?subject=Quotation%20Request&body=${body}">Open email app</a><a class="btn g sm" target="_blank" rel="noopener" href="https://mail.google.com/mail/?view=cm&fs=1&to=${esc(c.email)}&su=Quotation%20Request&body=${body}">Open in Gmail</a>`;if(c.email)try{location.href=`mailto:${esc(c.email)}?subject=Quotation%20Request&body=${body}`}catch(x){};if(c.whatsapp)h+=`<a class="btn g sm" target="_blank" rel="noopener" href="https://wa.me/${esc(c.whatsapp.replace(/\D/g,''))}?text=${body}">Send by WhatsApp</a>`;if(!saved&&!c.email&&!c.whatsapp)h='Contact details have not been set up yet. Please try again later.';else if(!saved)h='Your quotation request is ready, addressed to our email. Tap Send in your email app. If it did not open, use: '+h;$('#q_o').innerHTML=h}
render();
</script>
</body></html>
