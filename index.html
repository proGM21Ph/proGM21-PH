<style>

.rv{opacity:0;transform:translateY(34px);transition:opacity .8s var(--d,0s),transform .8s var(--d,0s)}.rv.in{opacity:1;transform:none}

</style></head><body>
<header><nav id="nav"></nav></header>
<main id="root"></main>

<div id="lb" onclick="this.style.display='none';this.innerHTML=''"></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=SITE,admin=false,DB=null;
const U=p=>(window.PREV&&PREV[p])||p||'';
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#dfe5ee"/><path d="M60 230h280M90 230V90h60v140M170 230V60h60v170M250 230V110h60v120" stroke="#12284c" stroke-width="8" fill="none"/><text x="200" y="272" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#5b6675">Photo coming soon</text></svg>');
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const C=()=>D.contact;
function enc(){const c=C();return 'Hello, I would like to request a quotation for Euroform products.'}
function links(){const c=C();let h='';if(c.whatsapp)h+=`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/${esc(c.whatsapp.replace(/\D/g,''))}?text=${encodeURIComponent(enc())}">WhatsApp</a>`;if(c.messenger)h+=`<a class="btn g" target="_blank" rel="noopener" href="${esc(c.messenger)}">Messenger</a>`;if(c.email)h+=`<a class="btn g" href="mailto:${esc(c.email)}?subject=Quotation%20Request">Email us</a>`;return h}
const catBtn=(c='g')=>D.brochure?`<a class="btn ${c}" href="${esc(D.brochure)}" target="_blank" rel="noopener">Download catalogue (PDF)</a>`:'';
function clientsBlock(){const cl=lines(D.clients);if(!cl.length)return admin?'<div class="w"><h2>Our Clients</h2><div class="card note">Only you can see this note: add your clients in Admin &gt; Our clients so they appear here for visitors.</div></div>':'';return `<div class="alt"><div class="w"><h2>Our Clients</h2><p class="note">Contractors and companies who use Euroform and ProGM21 products.</p><div class="grid">${cl.map(l=>{const a=l.split('|');return `<div class="card"><h3>${esc(a[0].trim())}</h3>${a[1]?esc(a.slice(1).join('|').trim()):''}</div>`}).join('')}</div></div></div>`}
const pages={
home(){const P=D.products,g=D.gallery.slice(0,3),ab=D.about.split('\n\n')[0],cl=lines(D.clients),f=r=>P.find(p=>r.test(p.name))||{},r=(i)=>`rv" style="--d:${i*.1}s`,
ex=[[f(/euro/i),'Euro Form System','Light, modular metal-frame and plywood panels for walls, columns, beams and slabs.'],[f(/spacer/i),'Rebar and Concrete Spacers','Cover spacers that keep reinforcement in the right position.'],[P[1]||{},'Formwork Accessories','Flat ties, hooks, wedge pins, corners, clamps and cross bars.'],[{img:D.consultImg},'Construction Consultation','Advice, value engineering, technical studies and schedule management.']];
return `<section class="hero hero2"><div class="slides">${g.map((x,i)=>`<div class="sl${i?'':' on'}" style="background-image:url('${U(x.src)}')"></div>`).join('')}</div><div class="w hw"><div class="eye">Formwork Excellence · Mandaue, Cebu</div><h1>${esc(D.h1)}</h1><p>${esc(D.hp)}</p><a class="btn" href="#products">Explore Our Products</a><a class="btn o" href="#contact">Request a Quotation</a>${catBtn('o')}</div><div class="cap" id="cap">${g[0]?esc(g[0].cap):''}</div><div class="dots">${g.map((x,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div></section><div class="haz"></div>
<section class="dk"><div class="w two"><div class="${r(0)}"><div class="kk">Who We Are</div><h2>Building Smarter for Cebu and Beyond.</h2><p style="white-space:pre-line">${esc(ab)}</p><p><b style="color:#fff">Practical solutions, reliable supply.</b></p><div class="st"><div><b>2017</b>Registered</div></div></div>${g[1]?`<div class="${r(2)}"><img class="wimg" src="${U(g[1].src)}" alt="${esc(g[1].cap)}"></div>`:''}</div></section>
<section class="dk2"><div class="w"><div class="kk">Our Expertise</div><h2>Products and Services</h2><div class="xg">${ex.map((e,i)=>`<a class="xc ${r(i)}" href="#products"><div class="im"><img src="${e[0].img?U(e[0].img):PH}" alt="${esc(e[1])}" loading="lazy"${i==0?' style="object-fit:contain;background:#fff"':''}></div><div class="tx"><div class="num">0${i+1}</div><h3>${e[1]}</h3><p>${e[2]}</p></div></a>`).join('')}</div></div></section>
<section class="dk"><div class="w"><div class="kk">Our Portfolio</div><h2>Featured Work</h2><div class="xg">${g.map((x,i)=>`<div class="wk ${r(i)}" onclick="lb(${i})"><img src="${U(x.src)}" alt="${esc(x.cap)}" loading="lazy"><div><span>Euroform</span><b>${esc(x.cap)}</b></div></div>`).join('')}</div><p style="margin-top:20px"><a class="btn o" href="#gallery">View Gallery</a></p></div></section>
<section class="dk2"><div class="w"><div class="kk">Why Choose Us</div><h2>We Build Better</h2><div class="xg">${[['Efficient','Installation and removal that keeps work moving.'],['Organized','Clear workflows on site.'],['Reusable','Reuse where applicable to the product and project.'],['Neat results','More consistent concrete work when properly installed.']].map((a,i)=>`<div class="xc ${r(i)}"><div class="tx"><div class="big">0${i+1}</div><h3>${a[0]}</h3><p>${a[1]}</p></div></div>`).join('')}</div><p class="note" style="color:#9aa6b6;margin-top:16px">Actual results depend on the product specification, project design, and proper installation. Potential savings in labor and time are not guaranteed.</p></div></section>
${clientsBlock()}<section class="cta"><div class="w"><h2>Ready to start your project?</h2><a class="btn" href="#contact">Request a Quotation</a><a class="btn o" href="#sizes">View Sizes</a></div></section>`},
products(){return `<div class="w"><h2>Products</h2>${D.products.map(p=>`<article class="pr" id="${esc(p.id)}"><img src="${p.img?U(p.img):PH}" alt="${esc(p.name)}"><div><h3 style="font-size:24px;margin:0 0 8px">${esc(p.name)}</h3><p>${esc(p.desc)}</p>
<div class="tbl"><table>${lines(p.specs).map(l=>{const i=l.indexOf(':'),k=l.slice(0,i).trim(),v=l.slice(i+1).trim();if(/^\d+:\s*[\d.]+(\s*\|\s*\d+:\s*[\d.]+)+$/.test(v)){return `<tr><td colspan="2" class="wtc"><div class="wtt">${esc(k)}</div><table class="wt"><thead><tr><th>Panel width (mm)</th><th>Weight (kg)</th></tr></thead><tbody>${v.split('|').map(x=>{const [a,b]=x.split(':').map(s=>s.trim());return `<tr><td>${esc(a)} x 1200</td><td>${esc(b)}</td></tr>`}).join('')}</tbody></table></td></tr>`}return `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`}).join('')}</table></div>
<p><b>Available sizes:</b> ${esc(p.sizes)}<br><b>Accessories:</b> ${esc(p.accessories)}</p><b>Key features</b><ul>${lines(p.features).map(l=>`<li>${esc(l)}</li>`).join('')}</ul><b>Installation guide</b><ol>${lines(p.steps).map(l=>`<li>${esc(l)}</li>`).join('')}</ol><b>Safety, handling and maintenance</b><p>${esc(p.safety)}</p>
${catBtn()}<a class="btn" href="#contact" onclick="window.pick='${esc(p.name)}'">Request a quotation</a></div></article>`).join('')||'<p>No products yet.</p>'}</div>`},
gallery(){return `<div class="w"><h2>Gallery and Videos</h2><div id="galbox">${galBox()}</div></div>`},
sizes(){const chips=v=>{v=String(v||'').trim();if(!v||v==='-')return '<span class="na">&mdash;</span>';return v.split(' / ').map(p=>'<span class="chip">'+esc(p.trim())+'</span>').join('')},ok=v=>v==='1'?'<span class="yes" title="Available">&#10003;</span>':'<span class="na">&mdash;</span>',T=(x,h,mode)=>'<div class="tbl"><table><thead><tr>'+h.map((y,i)=>'<th class="'+(mode==1&&i>1?'c':'')+'">'+esc(y)+'</th>').join('')+'</tr></thead><tbody>'+lines(x).map(l=>{const c=l.split('|').map(y=>y.trim());return '<tr>'+c.map((y,i)=>i==0?'<td>'+esc(y)+'</td>':(mode==1&&i>1)?'<td class="c">'+ok(y)+'</td>':'<td>'+chips(y)+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>',go=id=>`onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth'})"`;return `<div class="w pl"><h2>Sizes</h2><div class="pbn"><span class="pbs">mm</span><div><b>Available sizes of our Euro Form products and accessories.</b><br><span class="note">For pricing, rental and purchase options, please request a quotation.</span></div></div><div class="pjump"><button type="button" ${go('pl1')}>Euro Form items</button><button type="button" ${go('pl2')}>Accessories</button><button type="button" ${go('pl3')}>Available for rental</button></div><h3 id="pl1">Euro Form items</h3>${T(D.sizes1,['Item','Size (mm)','Brand new','Refurbished'],1)}<h3 id="pl2">Accessories and consumables</h3>${T(D.sizes2,['Item','Sizes / Specification'],0)}<h3 id="pl3">Available for rental</h3>${T(D.sizes3,['Item','Size (mm)'],0)}${catBtn()}<a class="btn" href="#contact">Request a Quotation</a></div>`},
about(){return `<div class="w"><h2>About Us</h2><div class="card"><h3>${esc(D.brand)}</h3><p style="white-space:pre-line">${esc(D.about)}</p></div></div>`},
contact(){const c=C(),pk=window.pick||'';return `<div class="w"><h2>Contact and Inquiry</h2><div class="grid"><div class="card"><h3>Contact details</h3>${[['Contact person',c.name],['Telephone',c.mobile],['Viber',c.viber],['Email',c.email],['Address',c.address]].map(a=>`<p><b>${a[0]}:</b> ${a[1]?esc(a[1]):'<span class="note">not set yet</span>'}</p>`).join('')}${c.facebook?`<p><a href="${esc(c.facebook)}" target="_blank" rel="noopener">Facebook page</a></p>`:''}<div>${links()}</div></div>
<div class="card"><h3>Request a Quotation</h3><div id="f"><label>Name</label><input id="q_n"><label>Company</label><input id="q_c"><label>Contact number</label><input id="q_t"><label>Project location</label><input id="q_l"><label>Product requirements</label><input id="q_r" value="${esc(pk)}"><label>Message</label><textarea id="q_m" rows="3"></textarea><button class="btn" onclick="send()">Request a Quotation</button><div id="q_o" class="note"></div></div></div></div></div>`}};
const GC=[['meeting','Client Meetings'],['install','Installation'],['arrival','Newly Arrived Products in Warehouse'],['delivery','Delivery']];let gf='meeting';
const gcat=g=>g.cat||'install';
function galBox(){const G=D.gallery.map((g,i)=>[g,i]);if(!G.length)return '<div class="card">No photos or videos yet.</div>';const n=k=>G.filter(x=>gcat(x[0])==k).length,C=GC.filter(c=>n(c[0]));
if(!C.some(c=>c[0]==gf))gf=C[0][0];
let o=`<div class="gtabs">${C.map(c=>`<button class="${gf==c[0]?'on':''}" onclick="gsel('${c[0]}')">${c[1]} (${n(c[0])})</button>`).join('')}</div>`;
C.forEach(c=>{if(gf!=c[0])return;o+=`<h3 class="gh">${c[1]}</h3><div class="gal">${G.filter(x=>gcat(x[0])==c[0]).map(x=>{const g=x[0];return `<figure onclick="lb(${x[1]})">${g.t=='video'?`<video src="${U(g.src)}" muted preload="metadata"></video>`:`<img src="${U(g.src)}" alt="${esc(g.cap)}" loading="lazy">`}<figcaption>${esc(g.cap)}</figcaption></figure>`}).join('')}</div>`});return o}
function gsel(k){gf=k;$('#galbox').innerHTML=galBox()}
function render(){let h=location.hash.slice(1)||'home';if(h==='pricing')h='sizes';if(!pages[h])h='home';$('#root').innerHTML=pages[h]();$('#nav').innerHTML=`<a href="#home" class="lg"><img src="${U(D.logo)}" alt="ProGM21 PH Corporation"></a>`+['home','products','sizes','gallery','about','contact'].map(k=>`<a href="#${k}" class="${k==h?'on':''}">${k[0].toUpperCase()+k.slice(1)}</a>`).join('');$('#ft').textContent='© '+new Date().getFullYear()+' '+D.brand+' - Euroform Formwork Products';scrollTo(0,0);mvInit();homeInit()}
addEventListener('hashchange',render);
function lb(i){const g=D.gallery[i],e=$('#lb');e.innerHTML=g.t=='video'?`<video src="${U(g.src)}" controls autoplay></video>`:`<img src="${U(g.src)}" alt="">`;e.style.display='flex';try{e.requestFullscreen&&e.requestFullscreen()}catch(x){}}
async function send(){const v=i=>$('#'+i).value.trim(),r={name:v('q_n'),company:v('q_c'),phone:v('q_t'),location:v('q_l'),req:v('q_r'),msg:v('q_m'),at:new Date().toISOString()};if(!r.name||!r.phone){$('#q_o').textContent='Please enter your name and contact number.';return}
let saved=false;try{if(DB){await DB.doc('inquiries/'+Date.now()+'_'+Math.random().toString(36).slice(2,6)).set(r);saved=true}}catch(e){}
const body=`Quotation request%0AName: ${encodeURIComponent(r.name)}%0ACompany: ${encodeURIComponent(r.company)}%0APhone: ${encodeURIComponent(r.phone)}%0ALocation: ${encodeURIComponent(r.location)}%0ARequirements: ${encodeURIComponent(r.req)}%0AMessage: ${encodeURIComponent(r.msg)}`,c=C();let h=saved?'Thank you! Your inquiry was recorded. ':'';
if(c.email)h+=`<a class="btn g sm" href="mailto:${esc(c.email)}?subject=Quotation%20Request&body=${body}">Open email app</a><a class="btn g sm" target="_blank" rel="noopener" href="https://mail.google.com/mail/?view=cm&fs=1&to=${esc(c.email)}&su=Quotation%20Request&body=${body}">Open in Gmail</a>`;if(c.email)try{location.href=`mailto:${esc(c.email)}?subject=Quotation%20Request&body=${body}`}catch(x){};if(c.whatsapp)h+=`<a class="btn g sm" target="_blank" rel="noopener" href="https://wa.me/${esc(c.whatsapp.replace(/\D/g,''))}?text=${body}">Send by WhatsApp</a>`;if(!saved&&!c.email&&!c.whatsapp)h='Contact details have not been set up yet. Please try again later.';else if(!saved)h='Your quotation request is ready, addressed to our email. Tap Send in your email app. If it did not open, use: '+h;$('#q_o').innerHTML=h}
/* Moving letters on scroll */
let mvEls=[],mvIO=null;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function mvInit(){
 if(mvIO)mvIO.disconnect();mvEls=[];
 document.querySelectorAll('.hero h1,#root h2').forEach(el=>{
  const t=el.textContent.trim();let n=0;
  el.setAttribute('aria-label',t);el.classList.add('mv');
  el.innerHTML=t.split(/\s+/).map(w=>'<span class="wd" aria-hidden="true">'+[...w].map(c=>'<span class="ch" style="--i:'+(n++)+'">'+esc(c)+'</span>').join('')+'</span>').join(' ');
  mvEls.push({el,hero:!!el.closest('.hero')})
 });
 mvIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');mvIO.unobserve(e.target)}}),{threshold:.2,rootMargin:'0px 0px -6% 0px'});
 mvEls.forEach(o=>{if(o.hero)setTimeout(()=>o.el.classList.add('in'),200);else mvIO.observe(o.el)});
 mvUpdate()
}
function mvUpdate(){
 const hr=document.querySelector('.hero h1.mv'),hs=document.querySelector('.hero');
 if(!hr||!hs||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const q=clamp(scrollY/(hs.offsetHeight*.85));
 hr.style.transform='translateY('+(q*36).toFixed(1)+'px)';hr.style.opacity=(1-q*.85).toFixed(2)
}
addEventListener('scroll',()=>requestAnimationFrame(mvUpdate),{passive:true});
addEventListener('resize',()=>mvUpdate());
let slT=0;
function homeInit(){
 clearInterval(slT);
 const ss=[...document.querySelectorAll('.sl')],dd=[...document.querySelectorAll('.dots i')],cp=$('#cap');
 if(ss.length>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches){let k=0;slT=setInterval(()=>{ss[k].classList.remove('on');dd[k]&&dd[k].classList.remove('on');k=(k+1)%ss.length;ss[k].classList.add('on');dd[k]&&dd[k].classList.add('on');if(cp&&D.gallery[k])cp.textContent=D.gallery[k].cap},5000)}
 const rv=[...document.querySelectorAll('.rv')];
 const show=e=>{e.classList.add('in');e.querySelectorAll('.cnt').forEach(c=>{const n=+c.dataset.n,t0=performance.now(),st=now=>{const x=Math.min(1,(now-t0)/1200);c.textContent=Math.round(n*x);if(x<1)requestAnimationFrame(st)};requestAnimationFrame(st)})};
 if(!('IntersectionObserver' in window)){rv.forEach(show);return}
 const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){show(x.target);io.unobserve(x.target)}}),{threshold:.12});
 rv.forEach(e=>io.observe(e))
}
D.h1=D.h1||'Built with Precision. Formed for Strength.';D.hp=D.hp||'Euroform formwork, concrete spacers and construction consultation for residential, commercial and industrial projects. Industrial strength, organized on site.';
function applyC(c){if(c.contact)Object.assign(D.contact,c.contact);['about','clients','h1','hp'].forEach(k=>{if(typeof c[k]=='string'&&c[k].trim())D[k]=c[k]})}
const jf=n=>fetch(n+'?'+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null);
Promise.all([jf('gallery.json'),jf('content.json')]).then(([g,c])=>{if(Array.isArray(g))D.gallery=g;if(c&&typeof c=='object')applyC(c)}).then(render);
</script>
