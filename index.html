const F=(l,k,v,t)=>t?`<label>${l}</label><textarea rows="4" data-k="${k}">${esc(v)}</textarea>`:`<label>${l}</label><input data-k="${k}" value="${esc(v)}">`;
function setk(k,v){const p=k.split('.');let o=D;while(p.length>1)o=o[p.shift()];o[p[0]]=v}
async function adm(){const m=$('#adm');m.style.display='block';let inq='';try{if(DB){const s=await DB.collection('inquiries').get();inq=s.docs.map(d=>d.data()).sort((a,b)=>(b.at||'').localeCompare(a.at||'')).map(r=>`<div class="row"><b>${esc(r.name)}</b> - ${esc(r.company)} - ${esc(r.phone)}<br>${esc(r.location)} | ${esc(r.req)}<br>${esc(r.msg)}<br><span class="note">${esc(r.at)}</span></div>`).join('')||'<p class="note">No inquiries yet.</p>'}}catch(e){inq='<p class="note">Inquiries could not be loaded.</p>'}
const c=C();m.innerHTML=`<div class="box"><h2>Administrator</h2><button class="btn g sm" onclick="save()">Save and publish</button><button class="btn sm" onclick="closeA()">Close</button> <span id="st" class="note"></span>
<h3>Contact (shown publicly - do not invent details)</h3>${[['Contact person','contact.name'],['Mobile','contact.mobile'],['Email','contact.email'],['Address','contact.address'],['Facebook URL','contact.facebook'],['WhatsApp number (with country code)','contact.whatsapp'],['Messenger link','contact.messenger'],['Company name','brand']].map(a=>F(a[0],a[1],a[1]=='brand'?D.brand:c[a[1].split('.')[1]])).join('')}${F('About us','about',D.about,1)}
${F('Sale pricelist - Euro Form items (Item|Size|New|Refurbished)','sale4',D.sale4,1)}${F('Sale pricelist - accessories (Item|Spec|Price)','sale3',D.sale3,1)}${F('Rental table (Item|Base|1d|30d|60d|90d|120d|150d|180d)','rent',D.rent,1)}<h3>Brochure (PDF)</h3><input type="file" accept="application/pdf" onchange="up(this,'brochure')"> ${D.brochure?'<span class="note">Uploaded</span>':''}
<h3>Products</h3>${D.products.map((p,i)=>`<div class="row"><b>${esc(p.name)}</b> <button class="btn sm" onclick="del(${i})">Remove</button>${['name','sizes','accessories'].map(f=>F(f,'products.'+i+'.'+f,p[f])).join('')}${[['desc','Description'],['specs','Specifications (one per line, "Label: value")'],['features','Features (one per line)'],['steps','Installation steps (one per line)'],['safety','Safety and maintenance']].map(a=>F(a[1],'products.'+i+'.'+a[0],p[a[0]],1)).join('')}<label>Photo</label><input type="file" accept="image/*" onchange="up(this,'products.${i}.img')"></div>`).join('')}<button class="btn g sm" onclick="addP()">+ Add product</button>
<h3>Gallery</h3>${D.gallery.map((g,i)=>`<div class="row">${g.t} <input data-k="gallery.${i}.cap" value="${esc(g.cap)}"> <button class="btn sm" onclick="D.gallery.splice(${i},1);adm()">Remove</button></div>`).join('')}<label>Add photo or video</label><input type="file" accept="image/*,video/*" onchange="upG(this)">
<h3>Inquiries</h3>${inq}</div>`;m.oninput=e=>{const k=e.target.dataset.k;if(k)setk(k,e.target.value)}}
function closeA(){$('#adm').style.display='none';render()}
function addP(){D.products.push({id:'p'+Date.now(),name:'New product',desc:'',specs:'',sizes:'',accessories:'',features:'',steps:'',safety:'',img:''});adm()}
function del(i){if(confirm('Remove this product?')){D.products.splice(i,1);adm()}}
async function up(el,k){const f=el.files[0];if(!f||!AS)return;$('#st').textContent='Uploading...';try{const r=await AS.upload(f);setk(k,r.id);$('#st').textContent='Uploaded.'}catch(e){$('#st').textContent='Upload failed.'}}
async function upG(el){const f=el.files[0];if(!f||!AS)return;try{const r=await AS.upload(f);D.gallery.push({t:f.type.startsWith('video')?'video':'img',id:r.id,cap:'Caption'});adm()}catch(e){$('#st').textContent='Upload failed.'}}
async function save(){$('#st').textContent='Publishing...';const c=document.documentElement.cloneNode(true);c.querySelector('#root').innerHTML='';c.querySelector('#nav').innerHTML='';c.querySelector('#adm').innerHTML='';c.querySelector('#adm').removeAttribute('style');c.querySelector('#lb').innerHTML='';c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');try{await A.publish('<!doctype html>'+c.outerHTML)}catch(e){$('#st').textContent='Could not publish: '+(e&&e.code||'error')}}
render();
(async()=>{try{const u=await claude.use('user');A=await claude.use('artifact');AS=await claude.use('assets');DB=await claude.use('db');admin=!!(u&&A&&await u.canEdit());if(admin)render()}catch(e){}})();
</script></body></html>
